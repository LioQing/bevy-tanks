[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/bevy-tanks-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LioQing/bevy-tanks"

[workspace.dependencies]
bevy = "0.15"
bevy_enhanced_input = "0.10"
bevy-inspector-egui = "0.30.0"
bevy_rand = { version = "0.9", features = ["wyrand"] }
bevy_rapier3d = { version = "0.29", features = [
    "simd-stable",
    "debug-render-3d",
] }
bevy-tnua = "0.23"
bevy-tnua-rapier3d = "0.11"
# Wait for oxidized_navigation to update to parry3d 0.18,
# but it is blocked by avian3d using parry3d 0.17
oxidized_navigation = { git = "https://github.com/LioQing/oxidized_navigation", features = [
    "rapier",
    "debug_draw",
] }
paste = "1.0"
rand = "0.8"
rand_core = "0.6"
rand_distr = "0.4"

[profile.dev]
debug = 0
strip = "debuginfo"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
